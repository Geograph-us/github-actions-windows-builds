name: Build Ladybird Windows x64 Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  BUILD_PRESET: Release

jobs:
  build:
    name: Ladybird Windows x64 Release
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Clone Ladybird
        shell: powershell
        run: |
          git clone --depth 1 https://github.com/LadybirdBrowser/ladybird.git ladybird

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Visual Studio x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        shell: powershell
        run: |
          choco install pkgconfiglite ninja nasm -y --no-progress

      - name: Show tool versions
        shell: powershell
        working-directory: ladybird
        run: |
          cmake --version
          ninja --version
          clang-cl --version
          py --version
          rustc --version
          cargo --version

      - name: Build Ladybird
        shell: powershell
        working-directory: ladybird
        env:
          CC: clang-cl
          CXX: clang-cl
        run: |
          py Meta\ladybird.py build

      - name: Install build
        shell: powershell
        working-directory: ladybird
        run: |
          if (Test-Path ..\dist) {
            Remove-Item ..\dist -Recurse -Force
          }

          cmake `
            --install Build\release `
            --prefix ..\dist

      - name: Check installed files
        shell: powershell
        run: |
          if (!(Test-Path dist)) {
            throw "dist directory was not created"
          }

          Get-ChildItem dist -Recurse |
            Select-Object FullName, Length

      - name: Create ZIP
        shell: powershell
        run: |
          $version = git -C ladybird rev-parse --short HEAD
          $zip = "Ladybird-Windows-x64-Release-$version.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path dist\* `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          Write-Host "Created: $zip"
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64-Release
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
