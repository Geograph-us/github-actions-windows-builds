name: Build Ladybird (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Освобождаем место на диске (удаляем тяжелые ненужные пакеты виртуальной машины)
      - name: Free Disk Space
        shell: pwsh
        run: |
          Write-Host "Свободное место до очистки:"
          Get-PSDrive C, D | Select-Object Name, @{Name="Free (GB)";Expression={[math]::round($_.Free/1GB,2)}}

          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache" -ErrorAction SilentlyContinue

          Write-Host "Свободное место после очистки:"
          Get-PSDrive C, D | Select-Object Name, @{Name="Free (GB)";Expression={[math]::round($_.Free/1GB,2)}}

      # 2. Клонируем исходный код Ladybird
      - name: Clone Ladybird repo
        run: |
          git clone --recursive https://github.com/LadybirdBrowser/ladybird.git

      # 3. Устанавливаем базовые инструменты сборки
      - name: Install build tools via Chocolatey
        shell: pwsh
        run: |
          choco feature enable -n allowGlobalConfirmation
          choco install -y git
          choco install -y cmake --installargs 'ADD_CMAKE_TO_PATH=System'
          choco install -y ninja
          choco install -y llvm
          choco install -y pkgconfiglite
          choco install -y nasm
          choco install -y zip unzip

      # 4. Кэширование vcpkg артефактов
      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            ~/.cache/vcpkg
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('ladybird/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      # 5. Конфигурируем CMake через vcpkg (СТРОГО Release режим!)
      - name: Configure CMake with vcpkg
        working-directory: ladybird
        shell: bash
        env:
          VCPKG_BUILD_TYPE: release
        run: |
          mkdir build
          cd build
          cmake -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="x64-windows" \
            -DVCPKG_BUILD_TYPE=release \
            ..

      # 6. Компилируем Ladybird
      - name: Build Ladybird
        working-directory: ladybird
        run: cmake --build build --config Release

      # 7. Упаковываем готовый результат и необходимые DLL
      - name: Package Ladybird.exe and DLLs
        working-directory: ladybird
        shell: pwsh
        run: |
          $out = "$PWD/artifact"
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          # Копируем исполнительный файл
          $exePath = Get-ChildItem -Path build -Filter "ladybird.exe" -Recurse | Select-Object -First 1
          if (-Not $exePath) {
            Write-Error "Ladybird.exe не найден в каталоге build."
            exit 1
          }
          Copy-Item $exePath.FullName -Destination $out

          # Копируем все скомпилированные DLL от vcpkg
          if (Test-Path "build/vcpkg_installed/x64-windows/bin/*.dll") {
            Copy-Item "build/vcpkg_installed/x64-windows/bin/*.dll" -Destination $out -Force
          }

          # Архивация в ZIP
          Compress-Archive -Path $out\* -DestinationPath ../ladybird-windows.zip -Force

      # 8. Выгружаем готовый архив в раздел Artifacts
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-windows
          path: ladybird-windows.zip
