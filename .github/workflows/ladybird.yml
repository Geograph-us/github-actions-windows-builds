name: Build Ladybird (Windows x64 Release)

# Официально поддерживаемый способ сборки Ladybird на Windows — это WSL2.
# Нативная сборка (clang-cl / MSVC) отмечена в документации проекта как
# ЭКСПЕРИМЕНТАЛЬНАЯ ("there are still windows specific issues and the
# functionality is limited"), поэтому сборка может падать на отдельных
# vcpkg-портах в зависимости от текущего состояния апстрима.
# См.: https://github.com/LadybirdBrowser/ladybird/blob/master/Documentation/BuildInstructionsLadybird.md

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ветка/тег/коммит ladybird для сборки"
        required: false
        default: "master"
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 240

    env:
      # Ладыбёрд сам качает и бутстрапит vcpkg в Toolchain/Tarballs/vcpkg
      LADYBIRD_SOURCE_DIR: ${{ github.workspace }}

    steps:
      - name: Checkout Ladybird
        uses: actions/checkout@v6
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ inputs.ref || 'master' }}
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build tools (Chocolatey)
        shell: pwsh
        run: |
          choco install -y nasm ninja pkgconfiglite
          # Гарантируем свежий CMake (>= 3.30 требуется по документации проекта)
          choco upgrade -y cmake --installargs 'ADD_CMAKE_TO_PATH=System'

      - name: Refresh PATH after Chocolatey installs
        shell: pwsh
        run: |
          echo "C:\Program Files\CMake\bin" >> $env:GITHUB_PATH
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Кэшируем каталог vcpkg с уже собранными портами, чтобы не пересобирать
      # ICU/Skia/Qt и прочие тяжёлые зависимости при каждом запуске.
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            Toolchain/Tarballs/vcpkg
            !Toolchain/Tarballs/vcpkg/buildtrees
            !Toolchain/Tarballs/vcpkg/downloads
          key: vcpkg-windows-x64-${{ hashFiles('Meta/CMake/vcpkg/**', 'vcpkg.json') }}
          restore-keys: |
            vcpkg-windows-x64-

      - name: Build Ladybird (Release)
        shell: cmd
        run: |
          python Meta\ladybird.py build

      - name: Install to distributable folder
        shell: cmd
        run: |
          cmake --install Build\release --prefix Build\dist

      - name: List installed files (диагностика)
        shell: pwsh
        run: Get-ChildItem -Recurse Build\dist | Select-Object -First 200 FullName

      - name: Determine package version
        id: version
        shell: pwsh
        run: |
          $sha = (git rev-parse --short HEAD)
          $ver = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace 'refs/tags/', '' } else { $sha }
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Package into zip
        shell: pwsh
        run: |
          $zipName = "ladybird-windows-x64-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path Build\dist\* -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-windows-x64-${{ steps.version.outputs.version }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 14
