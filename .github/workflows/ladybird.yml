name: Build Ladybird (Windows x64 Release)

# Официально поддерживаемый способ сборки Ladybird на Windows — это WSL2.
# Нативная сборка (clang-cl / MSVC) отмечена в документации проекта как
# ЭКСПЕРИМЕНТАЛЬНАЯ ("there are still windows specific issues and the
# functionality is limited"), поэтому сборка может падать на отдельных
# vcpkg-портах в зависимости от текущего состояния апстрима.
# См.: https://github.com/LadybirdBrowser/ladybird/blob/master/Documentation/BuildInstructionsLadybird.md

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ветка/тег/коммит ladybird для сборки"
        required: false
        default: "master"
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 240

    steps:
      - name: Enable Windows/Git long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - name: Checkout Ladybird
        uses: actions/checkout@v6
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ inputs.ref || 'master' }}
          submodules: recursive

      # GitHub Actions по умолчанию клонирует репозиторий в путь вида
      # D:\a\<repo>\<repo>\..., а глубоко вложенные буилд-деревья vcpkg для Qt
      # (buildtrees\qtbase\...) легко превышают MAX_PATH = 260 символов.
      # Это приводит к ошибке MSVC:
      #   fatal error C1083: Cannot open compiler generated file: '': Invalid argument
      # Лечится подключением реального чекаута под короткую букву диска.
      - name: "Mount short path (subst L: -> workspace)"
        shell: cmd
        run: 'subst L: "%GITHUB_WORKSPACE%"'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build tools (Chocolatey)
        shell: pwsh
        run: |
          choco install -y nasm ninja pkgconfiglite
          # Гарантируем свежий CMake (>= 3.30 требуется по документации проекта)
          choco upgrade -y cmake --installargs 'ADD_CMAKE_TO_PATH=System'

      - name: Refresh PATH after Chocolatey installs
        shell: pwsh
        run: |
          echo "C:\Program Files\CMake\bin" >> $env:GITHUB_PATH
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---------------------------------------------------------------
      # vcpkg binary caching через нативный GitHub Actions backend.
      # В отличие от кэширования всей папки Toolchain/Tarballs/vcpkg,
      # x-gha кэширует каждый порт отдельно по хешу его конфигурации —
      # попадания случаются чаще (например, при изменении одной
      # зависимости остальные всё равно берутся из кэша).
      # https://learn.microsoft.com/vcpkg/users/binarycaching
      # ---------------------------------------------------------------
      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Enable vcpkg binary caching (x-gha)
        shell: pwsh
        run: |
          echo "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite" >> $env:GITHUB_ENV

      # ---------------------------------------------------------------
      # sccache ускоряет саму компиляцию Ladybird (LibWeb/LibJS/AK и т.д.),
      # а не только сборку vcpkg-зависимостей. Кэш также хранится в GHA.
      # ---------------------------------------------------------------
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Build Ladybird (Release)
        shell: cmd
        working-directory: L:\
        env:
          SCCACHE_GHA_ENABLED: "true"
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: |
          python Meta\ladybird.py build

      - name: Show sccache stats (диагностика)
        shell: pwsh
        run: sccache --show-stats

      - name: Install to distributable folder
        shell: cmd
        working-directory: L:\
        run: |
          cmake --install Build\release --prefix Build\dist

      - name: List installed files (диагностика)
        shell: pwsh
        working-directory: L:\
        run: Get-ChildItem -Recurse Build\dist | Select-Object -First 200 FullName

      - name: Determine package version
        id: version
        shell: pwsh
        working-directory: L:\
        run: |
          $sha = (git rev-parse --short HEAD)
          $ver = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace 'refs/tags/', '' } else { $sha }
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Package into zip
        shell: pwsh
        working-directory: L:\
        run: |
          $zipName = "ladybird-windows-x64-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path Build\dist\* -DestinationPath "L:\$zipName"
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-windows-x64-${{ steps.version.outputs.version }}
          path: L:\${{ env.ZIP_NAME }}
          retention-days: 14
