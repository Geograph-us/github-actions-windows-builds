name: Build Ladybird (Windows x64 Release)

# Официально поддерживаемый способ сборки Ladybird на Windows — это WSL2.
# Нативная сборка (clang-cl / MSVC) отмечена в документации проекта как
# ЭКСПЕРИМЕНТАЛЬНАЯ ("there are still windows specific issues and the
# functionality is limited"), поэтому сборка может падать на отдельных
# vcpkg-портах в зависимости от текущего состояния апстрима.
# См.: https://github.com/LadybirdBrowser/ladybird/blob/master/Documentation/BuildInstructionsLadybird.md

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ветка/тег/коммит ladybird для сборки"
        required: false
        default: "master"
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 240
    permissions:
      contents: write   # нужно для создания GitHub Release

    steps:
      - name: Enable Windows/Git long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      # ---------------------------------------------------------------
      # ВАЖНО: НЕ используем actions/checkout + subst.
      #
      # actions/checkout всегда кладёт репозиторий в GITHUB_WORKSPACE,
      # т.е. в глубокий путь вида D:\a\<owner>\<repo>\<repo>\...
      # `subst L: <workspace>` создаёт лишь DOS-device alias на уровне
      # сессии Windows, а не реальный alias в файловой системе. Многие
      # инструменты (в частности, Python's os.path.realpath(), который
      # используется внутри Meta/ladybird.py и в части CMake-тулчейна)
      # на Windows вызывают GetFinalPathNameByHandle и РЕЗОЛВЯТ
      # subst-диск обратно в исходный длинный путь — то есть subst
      # "протекает" и не решает проблему MAX_PATH.
      #
      # Поэтому клонируем репозиторий вручную в короткий реальный путь
      # у корня диска (D:\l), минуя GITHUB_WORKSPACE вообще.
      # ---------------------------------------------------------------
      - name: Clone Ladybird into short path (D:\l)
        shell: cmd
        env:
          REF: ${{ inputs.ref || 'master' }}
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/LadybirdBrowser/ladybird.git D:\l
          cd /d D:\l
          git checkout %REF%
          git submodule update --init --recursive --depth 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build tools (Chocolatey)
        shell: pwsh
        run: |
          choco install -y nasm ninja pkgconfiglite
          # Гарантируем свежий CMake (>= 3.30 требуется по документации проекта)
          choco upgrade -y cmake --installargs 'ADD_CMAKE_TO_PATH=System'

      - name: Refresh PATH after Chocolatey installs
        shell: pwsh
        run: |
          echo "C:\Program Files\CMake\bin" >> $env:GITHUB_PATH
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---------------------------------------------------------------
      # Кэш собранных vcpkg-пакетов (Qt, Skia, ICU ... ~1.5 ч сборки).
      # Провайдер x-gha удалён из vcpkg (апрель 2025), поэтому используем
      # файловый бинарный кэш vcpkg + официальный actions/cache.
      # Ключ - хеш vcpkg.json и overlay-портов Ladybird; если они не менялись,
      # пакеты просто распаковываются из кэша вместо пересборки.
      # vcpkg сам проверяет ABI-хеш (компилятор, триплет, опции), так что
      # устаревшие бинарники из кэша не подхватываются.
      # ---------------------------------------------------------------
      - name: Compute vcpkg cache key
        id: vcpkgkey
        shell: pwsh
        run: |
          $files = @("D:\l\vcpkg.json")
          $files += Get-ChildItem "D:\l\Meta\CMake\vcpkg" -Recurse -File -ErrorAction SilentlyContinue | Sort-Object FullName | ForEach-Object FullName
          $sb = [System.Text.StringBuilder]::new()
          foreach ($f in $files) { [void]$sb.Append((Get-FileHash $f).Hash) }
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($sb.ToString())
          $h = ([System.BitConverter]::ToString([System.Security.Cryptography.SHA256]::Create().ComputeHash($bytes)) -replace '-', '').Substring(0, 16)
          echo "hash=$h" >> $env:GITHUB_OUTPUT

      - name: Configure vcpkg binary cache (files)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force D:\vcpkg-cache | Out-Null
          echo "VCPKG_BINARY_SOURCES=clear;files,D:\vcpkg-cache,readwrite" >> $env:GITHUB_ENV

      - name: Restore vcpkg binary cache
        id: vcpkgcache
        uses: actions/cache/restore@v4
        with:
          path: D:\vcpkg-cache
          key: vcpkg-bin-windows-x64-${{ steps.vcpkgkey.outputs.hash }}
          restore-keys: |
            vcpkg-bin-windows-x64-

      - name: Build Ladybird (Release)
        shell: cmd
        working-directory: D:\l\
        run: |
          python Meta\ladybird.py build

      # always(): даже если сборка Ladybird упала, готовые vcpkg-пакеты сохраняются.
      - name: Save vcpkg binary cache
        if: ${{ always() && steps.vcpkgcache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: D:\vcpkg-cache
          key: vcpkg-bin-windows-x64-${{ steps.vcpkgkey.outputs.hash }}

      - name: Install to distributable folder
        shell: cmd
        working-directory: D:\l\
        run: |
          cmake --install Build\release --prefix Build\dist

      # Ladybird на Windows не раскладывает runtime-зависимости при install,
      # но post-build шаг (lagom_copy_runtime_dlls) кладёт vcpkg-DLL и плагины Qt
      # рядом с exe в Build\release\<bin|libexec>. Добираем из него недостающее.
      # robocopy: /XC /XN /XO = копировать только те файлы, которых ещё нет.
      - name: Assemble runtime layout (add Qt DLLs, strip dev files)
        shell: pwsh
        run: |
          $dist  = "D:\l\Build\dist"
          $build = "D:\l\Build\release"

          foreach ($d in @("bin", "libexec")) {
            $src = Join-Path $build $d
            $dst = Join-Path $dist $d
            if ((Test-Path $src) -and (Test-Path $dst)) {
              robocopy $src $dst *.dll /S /XC /XN /XO /NFL /NDL /NJH /NJS | Out-Null
            }
          }
          $global:LASTEXITCODE = 0   # robocopy возвращает 1-7 при успехе

          # На Windows Ladybird ищет helper-процессы (RequestServer, WebContent, ...) рядом с
          # Ladybird.exe, а не в libexec (проверено запуском: пути bin/RequestServer и ./RequestServer).
          # Поэтому переносим содержимое libexec в bin, DLL для них уже лежат в bin.
          $binDir = Join-Path $dist "bin"
          $libexecDir = Join-Path $dist "libexec"
          if (Test-Path $libexecDir) {
            Get-ChildItem $libexecDir -Force | ForEach-Object {
              $t = Join-Path $binDir $_.Name
              if (-not (Test-Path $t)) { Move-Item $_.FullName $t }
            }
            Remove-Item $libexecDir -Recurse -Force
          }

          # VC++ runtime (app-local): чтобы браузер работал без установленного Redistributable.
          $crt = $null
          if ($env:VCToolsRedistDir) {
            $crt = Get-ChildItem (Join-Path $env:VCToolsRedistDir "x64") -Directory -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($crt) {
            Copy-Item (Join-Path $crt.FullName "*.dll") $binDir -Force
          } else {
            Write-Warning "VC++ runtime не найден (VCToolsRedistDir) - на чистой Windows понадобится Redistributable."
          }

          # include/ и lib/ нужны только для разработки. Удаляем, если в lib нет DLL.
          # share/ НЕ удаляем: там ресурсы (шрифты, стили, внутренние страницы).
          foreach ($d in @("include", "lib")) {
            $p = Join-Path $dist $d
            if ((Test-Path $p) -and -not (Get-ChildItem $p -Recurse -Filter *.dll -ErrorAction SilentlyContinue)) {
              Remove-Item $p -Recurse -Force
            }
          }
          Get-ChildItem $dist -Recurse -File -Include *.pdb,*.lib,*.exp,*.ilk | Remove-Item -Force

          # Раскладка: bin/ (exe + DLL + helper-процессы) и share/ (ресурсы).
          # В корень архива кладём запускалку.
          if (-not (Test-Path (Join-Path $dist "bin\Ladybird.exe"))) {
            Write-Warning "bin\Ladybird.exe не найден - проверьте имя exe в списке файлов ниже."
          }
          Set-Content -Path (Join-Path $dist "Ladybird.cmd") -Encoding ascii -Value '@echo off', 'start "" "%~dp0bin\Ladybird.exe" %*'

          if (-not (Get-ChildItem (Join-Path $dist "bin") -Filter "Qt6Core*.dll" -ErrorAction SilentlyContinue)) {
            Write-Warning "Qt6Core*.dll не найден в dist\bin - архив, скорее всего, не запустится. Смотрите список файлов ниже."
          }

          # Проверка зависимостей: для каждого exe/dll смотрим прямые импорты (dumpbin) и
          # предупреждаем, если DLL нет ни рядом, ни в System32. Транзитивные зависимости
          # покрываются тем, что и сами DLL проверяются. VC++ runtime (vcruntime140/msvcp140)
          # теперь лежит рядом с exe (копируется выше).
          if (Get-Command dumpbin -ErrorAction SilentlyContinue) {
            $sys = Join-Path $env:WINDIR "System32"
            $missing = @()
            foreach ($f in Get-ChildItem $dist -Recurse -File -Include *.exe,*.dll) {
              $deps = dumpbin /dependents $f.FullName | Select-String '^\s+(\S+\.dll)\s*$' | ForEach-Object { $_.Matches[0].Groups[1].Value }
              foreach ($dll in $deps) {
                if ($dll -match '^(api-ms-win|ext-ms-win)') { continue }
                if (-not (Test-Path (Join-Path $f.DirectoryName $dll)) -and -not (Test-Path (Join-Path $sys $dll))) {
                  $missing += "$($f.Name) -> $dll"
                }
              }
            }
            $global:LASTEXITCODE = 0
            if ($missing.Count -gt 0) {
              Write-Warning "Не найдены зависимости:`n$(($missing | Sort-Object -Unique) -join "`n")"
            } else {
              Write-Host "Проверка зависимостей: все DLL на месте."
            }
          }

          Get-ChildItem $dist -Recurse -File | Select-Object -First 400 -ExpandProperty FullName

      - name: Determine package version
        id: version
        shell: pwsh
        working-directory: D:\l\
        run: |
          $sha = (git rev-parse --short HEAD)
          $ver = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace 'refs/tags/', '' } else { $sha }
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Package into zip
        shell: pwsh
        working-directory: D:\l\
        run: |
          $zipName = "ladybird-windows-x64-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path Build\dist\* -DestinationPath "D:\l\$zipName"
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      # Страховка: если публикация релиза упадёт, результат сборки не пропадёт.
      # Загружаем ПАПКУ (upload-artifact сам упакует в zip), а не готовый zip.
      - name: Upload artifact (safety net)
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-windows-x64-${{ steps.version.outputs.version }}
          path: D:\l\Build\dist
          if-no-files-found: error
          retention-days: 3

      # Публикуем zip в Releases вашего репозитория (не Ladybird!).
      # Прямая ссылка: https://github.com/<owner>/<repo>/releases/download/<tag>/<файл>.zip
      # Шаг НЕ запускается из D:\l, иначе gh определил бы репозиторий по git-remote Ladybird.
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          LB_SHA: ${{ steps.version.outputs.sha }}
          LB_VERSION: ${{ steps.version.outputs.version }}
          LB_REF: ${{ inputs.ref || 'master' }}
        run: |
          $zip   = "D:\l\$env:ZIP_NAME"
          $repo  = $env:GITHUB_REPOSITORY
          $isTag = $env:GITHUB_REF -like 'refs/tags/*'
          $tag   = if ($isTag) { $env:GITHUB_REF_NAME } else { "ladybird-$env:LB_VERSION" }
          $notes = "Ladybird ref: $env:LB_REF, commit: $env:LB_SHA"

          gh release view $tag --repo $repo 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber --repo $repo
          } else {
            $ghArgs = @($tag, $zip, "--repo", $repo, "--title", "Ladybird Windows x64 $tag", "--notes", $notes, "--target", $env:GITHUB_SHA)
            if (-not $isTag) { $ghArgs += "--prerelease" }
            gh release create @ghArgs
          }
          if ($LASTEXITCODE -ne 0) { throw "Не удалось опубликовать релиз" }
