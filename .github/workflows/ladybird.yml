name: Build Ladybird (Windows)

on:
  workflow_dispatch:

env:
  TEMP: "D:\\tmp"
  TMP: "D:\\tmp"
  VCPKG_ROOT: "D:\\vcpkg"

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Переносим vcpkg на D:
      - name: Relocate vcpkg to Drive D:
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "D:\tmp" -Force | Out-Null
          if (Test-Path "C:\vcpkg") {
            Write-Host "Переносим vcpkg на диск D:..."
            Move-Item -Path "C:\vcpkg" -Destination "D:\vcpkg" -Force
          }
          Get-PSDrive C, D | Select-Object Name, @{Name="Free (GB)";Expression={[math]::round($_.Free/1GB,2)}}

      # 2. Создаем кастомный триплет, который СТРОГО запрещает Debug сборку
      - name: Create Custom Release Triplet
        shell: pwsh
        run: |
          $tripletContent = @"
          set(VCPKG_TARGET_ARCHITECTURE x64)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE dynamic)
          set(VCPKG_BUILD_TYPE release)
          "@
          New-Item -Path "D:\vcpkg\triplets\custom-x64-rel.cmake" -Value $tripletContent -Force

      # 3. Клонируем исходный код Ladybird
      - name: Clone Ladybird repo
        run: |
          git clone --recursive https://github.com/LadybirdBrowser/ladybird.git

      # 4. Подготавливаем Python 3 для CMake
      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 5. Устанавливаем базовые инструменты сборки
      - name: Install build tools via Chocolatey
        shell: pwsh
        run: |
          choco feature enable -n allowGlobalConfirmation
          choco install -y git
          choco install -y cmake --installargs 'ADD_CMAKE_TO_PATH=System'
          choco install -y ninja
          choco install -y llvm
          choco install -y pkgconfiglite
          choco install -y nasm
          choco install -y zip unzip

      # 6. Кэширование vcpkg артефактов на диске D:
      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            D:/vcpkg/installed
            D:/vcpkg/downloads
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('ladybird/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      # 7. Конфигурируем CMake с использованием кастомного триплета custom-x64-rel
      - name: Configure CMake with vcpkg
        working-directory: ladybird
        shell: bash
        run: |
          mkdir build
          cd build
          cmake -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_TOOLCHAIN_FILE="D:/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="custom-x64-rel" \
            ..

      # 8. Компилируем Ladybird
      - name: Build Ladybird
        working-directory: ladybird
        run: cmake --build build --config Release

      # 9. Упаковываем готовый результат и DLL
      - name: Package Ladybird.exe and DLLs
        working-directory: ladybird
        shell: pwsh
        run: |
          $out = "$PWD/artifact"
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          # Копируем исполнительный файл
          $exePath = Get-ChildItem -Path build -Filter "ladybird.exe" -Recurse | Select-Object -First 1
          if (-Not $exePath) {
            Write-Error "Ladybird.exe не найден в каталоге build."
            exit 1
          }
          Copy-Item $exePath.FullName -Destination $out

          # Копируем скомпилированные DLL от vcpkg
          if (Test-Path "build/vcpkg_installed/custom-x64-rel/bin/*.dll") {
            Copy-Item "build/vcpkg_installed/custom-x64-rel/bin/*.dll" -Destination $out -Force
          }

          # Архивация в ZIP
          Compress-Archive -Path $out\* -DestinationPath ../ladybird-windows.zip -Force

      # 10. Выгружаем готовый архив в раздел Artifacts
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-windows
          path: ladybird-windows.zip
