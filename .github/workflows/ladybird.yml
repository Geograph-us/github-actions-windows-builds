name: Build Ladybird (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Клонируем исходный код Ladybird
      - name: Clone Ladybird repo
        run: |
          git clone --recursive https://github.com/LadybirdBrowser/ladybird.git

      # 2. Устанавливаем базовые инструменты сборки
      - name: Install build tools via Chocolatey
        shell: pwsh
        run: |
          choco feature enable -n allowGlobalConfirmation
          choco install -y git
          choco install -y cmake --installargs 'ADD_CMAKE_TO_PATH=System'
          choco install -y ninja
          choco install -y llvm
          choco install -y pkgconfiglite
          choco install -y qt6-base-dev qt6-tools
          choco install -y nasm
          choco install -y zip unzip

      # 3. Включаем кэш vcpkg (чтобы не пересобирать зависимости каждый раз)
      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            ~/.cache/vcpkg
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('ladybird/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      # 4. Конфигурируем CMake через vcpkg (автоматически ставит FastFloat, mimalloc, ICU и др.)
      - name: Configure CMake with vcpkg
        working-directory: ladybird
        shell: bash
        run: |
          mkdir build
          cd build
          cmake -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="x64-windows" \
            ..

      # 5. Компилируем Ladybird
      - name: Build Ladybird
        working-directory: ladybird
        run: cmake --build build --config Release

      # 6. Упаковываем готовый результат и необходимые DLL
      - name: Package Ladybird.exe and DLLs
        working-directory: ladybird
        shell: pwsh
        run: |
          $out = "$PWD/artifact"
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          # Копируем исполнительный файл
          $exePath = Get-ChildItem -Path build -Filter "ladybird.exe" -Recurse | Select-Object -First 1
          if (-Not $exePath) {
            Write-Error "Ladybird.exe not found in build directory."
            exit 1
          }
          Copy-Item $exePath.FullName -Destination $out

          # Копируем все динамические библиотеки (DLL), скомпилированные vcpkg
          if (Test-Path "build/vcpkg_installed/x64-windows/bin/*.dll") {
            Copy-Item "build/vcpkg_installed/x64-windows/bin/*.dll" -Destination $out -Force
          }

          # Копируем Qt6 DLLs
          $qmake = Get-Command qmake -ErrorAction SilentlyContinue
          if ($qmake) {
            $qtBin = Split-Path ($qmake.Source)
            Copy-Item "$qtBin\Qt6*.dll" -Destination $out -Force

            $platformDir = Join-Path $qtBin "plugins\platforms"
            if (Test-Path $platformDir) {
              New-Item -ItemType Directory -Path "$out\platforms" -Force | Out-Null
              Copy-Item "$platformDir\*.dll" -Destination "$out\platforms" -Force
            }
          }

          # Архивация в ZIP
          Compress-Archive -Path $out\* -DestinationPath ../ladybird-windows.zip -Force

      # 7. Выгружаем готовый архив в раздел Artifacts
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-windows
          path: ladybird-windows.zip
